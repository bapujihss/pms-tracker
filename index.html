<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMS Student Status Tracker (Cloud Synchronized)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel/CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl">
                    <i class="fa-solid fa-graduation-cap text-2xl text-amber-300"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-xl font-bold tracking-tight">PMS Tracker & Cloud Audit</h1>
                        <span id="syncBadge" class="bg-amber-400 text-indigo-950 px-2 py-0.5 rounded-full text-[10px] font-bold animate-pulse">Connecting...</span>
                    </div>
                    <p class="text-xs text-indigo-200">Pre-Metric Scholarship Management for Teachers</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAddStudentModal()" class="bg-amber-400 hover:bg-amber-500 text-indigo-950 px-4 py-2 rounded-lg font-semibold text-sm transition shadow-sm flex items-center space-x-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Add Student</span>
                </button>
                <label class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg font-medium text-sm transition cursor-pointer flex items-center space-x-2">
                    <i class="fa-solid fa-file-excel text-emerald-400"></i>
                    <span>Import Excel</span>
                    <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelImport(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6 overflow-y-auto">

        <!-- Notification Banner / Toast -->
        <div id="toast" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
                <span id="toastMessage" class="text-sm font-medium">Action completed successfully.</span>
            </div>
            <button onclick="hideToast()" class="text-emerald-500 hover:text-emerald-700"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Dashboard Stats Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div onclick="filterByStatus('all')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-indigo-400 transition">
                <div class="flex justify-between items-start">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Students</p>
                    <div class="p-2 bg-indigo-50 text-indigo-600 rounded-lg"><i class="fa-solid fa-users"></i></div>
                </div>
                <h3 id="statTotal" class="text-2xl font-bold mt-2 text-slate-900">0</h3>
            </div>
            <div onclick="filterByStatus('Completed')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-emerald-400 transition">
                <div class="flex justify-between items-start">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Completed</p>
                    <div class="p-2 bg-emerald-50 text-emerald-600 rounded-lg"><i class="fa-solid fa-circle-check"></i></div>
                </div>
                <h3 id="statCompleted" class="text-2xl font-bold mt-2 text-emerald-600">0</h3>
            </div>
            <div onclick="filterByStatus('Incomplete')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-amber-400 transition">
                <div class="flex justify-between items-start">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Incomplete</p>
                    <div class="p-2 bg-amber-50 text-amber-600 rounded-lg"><i class="fa-solid fa-triangle-exclamation"></i></div>
                </div>
                <h3 id="statIncomplete" class="text-2xl font-bold mt-2 text-amber-600">0</h3>
            </div>
            <div onclick="filterByStatus('Aadhaar Issue')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-rose-400 transition">
                <div class="flex justify-between items-start">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Aadhaar / Seeding</p>
                    <div class="p-2 bg-rose-50 text-rose-600 rounded-lg"><i class="fa-solid fa-id-card-clip"></i></div>
                </div>
                <h3 id="statAadhaar" class="text-2xl font-bold mt-2 text-rose-600">0</h3>
            </div>
            <div onclick="filterByStatus('Doc Issue')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-purple-400 transition">
                <div class="flex justify-between items-start">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Income/Caste Issues</p>
                    <div class="p-2 bg-purple-50 text-purple-600 rounded-lg"><i class="fa-solid fa-file-invoice"></i></div>
                </div>
                <h3 id="statDocIssues" class="text-2xl font-bold mt-2 text-purple-600">0</h3>
            </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center w-full md:w-80 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search student, roll, or teacher..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select id="statusFilter" onchange="renderTable()" class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">All Statuses</option>
                    <option value="Completed">Completed</option>
                    <option value="Incomplete">Incomplete / Pending Docs</option>
                </select>
                <select id="sectionFilter" onchange="renderTable()" class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">All Sections (A & B)</option>
                    <option value="Section A">Section A</option>
                    <option value="Section B">Section B</option>
                </select>
